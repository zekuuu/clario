[package]
name = "clario"
version = "0.1.0"
description = "Local-first procurement spreadsheet validation desktop shell"
authors = ["Clario contributors"]
edition = "2021"

[lib]
name = "clario_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-single-instance = "2"
