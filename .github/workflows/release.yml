name: Release

# Push a tag like v0.1.0 to build the Windows setup and attach it to a draft GitHub release.
# The tag must match "version" in desktop/tauri/tauri.conf.json. Review the draft, then publish it on GitHub.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match tauri.conf.json version $version."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install failed." }
          npm ci --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed." }

      - name: Build setup
        shell: powershell
        run: .\build-desktop.ps1

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "releases/$env:VERSION/Clario_${env:VERSION}_x64-setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          # Fill in .github/release-notes.md; GitHub appends the generated changelog below it.
          (Get-Content .github/release-notes.md -Raw).Replace("{{VERSION}}", $env:VERSION).Replace("{{SHA256}}", $hash) |
            Set-Content release-notes.md -Encoding utf8
          gh release create "${{ github.ref_name }}" $setup `
            --draft --prerelease --generate-notes --notes-file release-notes.md --title "Clario $env:VERSION"
